[package]
name = "symexrs"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "Apache-2.0"
author = ["Rupak Majumdar and Codex"]
repository = "https://github.com/rupakm/symexrs"
description = "Symexrs: A concolic execution engine for async Rust"
keywords = ["symbolic", "testing"]
categories = ["development-tools::testing"]

[dependencies]
z3 = "0.12"
serde = { version = "1.0", features = ["derive"] }
libc = { version = "0.2", optional = true }
flate2 = "1.0"
md5 = "0.8.0"

[features]
default = ["libc"]

[dev-dependencies]
quickcheck = "1.0"
quickcheck_macros = "1.0"

[build-dependencies]
cc = "1.0"
